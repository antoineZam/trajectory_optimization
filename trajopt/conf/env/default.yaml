# Racing environment configuration (maps 1:1 onto envs.rl_environment.RLConfig)
#
# Every reward weight and normalization constant lives here so that experiments
# are Hydra overrides instead of source edits, e.g.:
#   python main.py env.progress_reward_scale=0.5 env.max_steps=800

# --- Simulation ---------------------------------------------------------------
dt: 0.05          # Timestep in seconds

# Episode step budget. `null` derives it from the track: a library of 1.9 km to
# 7 km circuits has no single right answer in steps, only in laps. Pin an
# integer to force one budget on every track.
max_steps: null
max_steps_lap_factor: 3.0   # laps of allowance at target_speed; on the 607 m
                            # sample oval that is 1458 steps, the budget this
                            # was originally tuned to.

# --- Observation normalization constants --------------------------------------
max_speed: 50.0               # m/s (~180 km/h)
max_lateral_velocity: 10.0    # m/s
max_yaw_rate: 3.0             # rad/s
max_lookahead_distance: 100.0 # meters

# --- Reward shaping targets ---------------------------------------------------
target_speed: 25.0  # m/s - optimal racing speed
min_speed: 5.0      # m/s - minimum acceptable speed

# --- Dense reward weights -----------------------------------------------------
# Kept in O(1) physical units so VecNormalize's return scale stays sane.
progress_reward_scale: 0.1   # Reward per METER of forward progress
speed_reward_scale: 0.03
centerline_reward_scale: 0.02  # Edge-proximity penalty scale

# --- Milestone rewards (~37% of a completed lap's return) ---------------------
checkpoint_bonus: 5.0
lap_completion_bonus: 15.0

# --- Penalties ----------------------------------------------------------------
off_track_penalty_scale: 0.2
termination_penalty: -10.0

# --- Checkpoint system --------------------------------------------------------
num_checkpoints: 4

# --- Termination --------------------------------------------------------------
wheels_required_inside: 2   # Below this many wheels on track, the episode ends

# --- Initial-state randomization ----------------------------------------------
# reset() used to always place the vehicle at centerline[0] at 5 m/s with no
# noise, so parallel workers produced identical rollouts and the value function
# only ever saw one narrow tube of state space.
randomize_reset: true
reset_lateral_fraction: 0.6   # of the half-width, either side of the centerline
reset_max_speed: 30.0         # m/s; the lower bound is min_speed
reset_heading_error: 0.2      # rad, either side of the track tangent
