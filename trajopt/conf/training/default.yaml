# Default RL training hyperparameters

# Total training timesteps
timesteps: 300000

# PPO algorithm parameters
algorithm: PPO
learning_rate: 0.0003
n_steps: 2048
batch_size: 64
n_epochs: 10
gamma: 0.99
gae_lambda: 0.95
clip_range: 0.2
ent_coef: 0.01
vf_coef: 0.5
max_grad_norm: 0.5

# Environment parameters
env:
  n_envs: 4
  normalize_obs: true
  normalize_reward: true

# Logging
log_interval: 10
save_freq: 50000

