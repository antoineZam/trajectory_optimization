# Default RL training configuration
# Balanced settings for stable training

# Total training timesteps
timesteps: 500000

# PPO algorithm hyperparameters
learning_rate: 0.0003
n_steps: 2048        # Steps per environment before update
batch_size: 256      # Minibatch size for updates
n_epochs: 10         # Epochs per update
gamma: 0.99          # Discount factor
gae_lambda: 0.95     # GAE lambda for advantage estimation
clip_range: 0.2      # PPO clipping parameter
ent_coef: 0.01       # Entropy coefficient (encourages exploration)
vf_coef: 0.5         # Value function loss coefficient
max_grad_norm: 0.5   # Gradient clipping

# Neural network architecture
network:
  pi_layers: [256, 256, 128]   # Policy network layers
  vf_layers: [256, 256, 128]   # Value function layers
  activation: tanh             # Activation function

# Environment parameters
env:
  n_envs: 4            # Number of parallel environments
  normalize_obs: true  # Normalize observations
  normalize_reward: false  # Disabled: milestones must remain visible to the agent
  clip_obs: 10.0       # Observation clipping threshold
  clip_reward: 10.0    # Reward clipping threshold

# Reproducibility: seeds PPO, the vec env and every env reset.
# A run is only reproducible from (config, seed) together.
seed: 0

# Logging settings
verbose: 1
tensorboard_log: ./tb_logs  # Learning curves; view with: tensorboard --logdir tb_logs
log_interval: 1            # ROLLOUTS between log dumps, not steps. 1 = one curve point per update.
save_freq: 50000            # Timesteps between intermediate checkpoints (0 = off)
