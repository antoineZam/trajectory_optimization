# Fast training configuration for quick experiments
# Uses more parallel environments and fewer timesteps

# Reduced timesteps for faster iteration
timesteps: 100000

# PPO hyperparameters optimized for speed
learning_rate: 0.0005  # Slightly higher for faster learning
n_steps: 1024          # Fewer steps for more frequent updates
batch_size: 128        # Smaller batch for faster updates
n_epochs: 5            # Fewer epochs per update
gamma: 0.995         # 1/(1-g) = 200 steps = 10 s horizon; a lap is ~540 steps.
                     # At 0.99 the horizon was 5 s and 0.99^540 = 0.0044, so the
                     # lap bonus was worth less than one step of progress reward.
gae_lambda: 0.95
clip_range: 0.2
ent_coef: 0.02         # Slightly more exploration
vf_coef: 0.5
max_grad_norm: 0.5

# Smaller network for faster training
network:
  pi_layers: [128, 128]
  vf_layers: [128, 128]
  activation: tanh

# More parallel environments for faster sample collection
env:
  n_envs: 8
  normalize_obs: true
  normalize_reward: true   # Divides by the running return std; a monotone
                           # global rescale, so milestone/dense ratios are preserved
  clip_obs: 10.0
  clip_reward: 10.0

# Less verbose logging
verbose: 1
seed: 0
tensorboard_log: ./tb_logs  # Learning curves; view with: tensorboard --logdir tb_logs
log_interval: 1            # ROLLOUTS between log dumps, not steps. 1 = one curve point per update.
save_freq: 25000
