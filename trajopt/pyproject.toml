[tool.poetry]
name = "trajopt"
version = "0.1.0"
description = "Système avancé de prédiction et d'optimisation de trajectoire"
authors = ["Antoine Zamord"]
readme = "README.md"
packages = [{include = "envs"}, {include = "models"}, {include = "physics"}, {include = "rl"}, {include = "utils"}]

[tool.poetry.dependencies]
python = "^3.10"

# Core scientific stack
numpy = "^2.0"
pandas = "^2.2"
scipy = "^1.14"
matplotlib = "^3.9"

# Computer vision & geometry
opencv-python = "^4.10"
shapely = "^2.0"
pyproj = "^3.6"
trimesh = "^4.4"

# Configuration
pyyaml = "^6.0"

# RL & Gymnasium
gymnasium = "^1.0"
stable-baselines3 = "^2.3"

# Deep Learning (PyTorch) - 2.6+ required for Python 3.13 on Windows
torch = "^2.6"
torchvision = "^0.21"

# Utilities
tqdm = "^4.66"

# Visualization (optional - requires Python <3.13 due to VTK)
pyvista = {version = "^0.44", optional = true, python = "<3.13"}
hydra-core = "^1.3.2"
omegaconf = "^2.3.0"
pydantic = "^2.12.5"

[tool.poetry.extras]
visualization = ["pyvista"]

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-cov = "^5.0"
ruff = "^0.6"
mypy = "^1.11"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
